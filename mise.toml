[tools]
bun = "1"
node = "24"

[tasks.lint]
description = "Lint scaffold + variant TS with biome"
run = "pnpm biome lint"

[tasks.fmt]
description = "Format scaffold + variant TS with biome"
run = "pnpm biome check --write"

[tasks.check]
description = "Run all checks before push"
depends = ["lint"]

[tasks."desk:pack-check"]
description = "Pack the desk program, install the tarball in a scratch project, import its parsers and run its bin"
run = "modules/desk/cli/scripts/pack-check.sh"

[tasks."desk:publish"]
description = "Bump the desk program version (patch, minor or major) and publish it to GitHub Packages; needs NODE_AUTH_TOKEN with write:packages"
run = "modules/desk/cli/scripts/publish.sh"
