[tools]
bun = "1"
node = "24"

[tasks.lint]
description = "Lint scaffold + variant TS with biome"
run = "pnpm biome lint"

[tasks.fmt]
description = "Format scaffold + variant TS with biome"
run = "pnpm biome check --write"

[tasks.check]
description = "Run all checks before push"
depends = ["lint"]

[tasks."frontdesk:pack-check"]
description = "Pack the frontdesk program, install the tarball in a scratch project, import its parsers and run its bin"
run = "modules/frontdesk/cli/scripts/pack-check.sh"

